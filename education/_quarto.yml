project:
  type: book
  output-dir: _book
  resources:
    - figures
    - videos

book:
  title: "From Photon Random Walks to Effective Atomic Fluorescence"
  subtitle: "A Computational Introduction to Kilonova Radiative Transfer"
  author: "revisit_sobolev"
  chapters:
    - index.qmd
    - part: "Part I — Radiative transfer from zero"
      chapters:
        - chapters/00_full_chain.qmd
        - chapters/01_transfer_equation.qmd
        - chapters/02_monte_carlo_packets.qmd
        - chapters/03_frequency_dependent_rt.qmd
        - chapters/04_expanding_sobolev.qmd
    - part: "Part II — What happens after a line interaction"
      chapters:
        - chapters/05_scalar_epsilon.qmd
        - chapters/06_atomic_cascades.qmd
        - chapters/07_energy_packets.qmd
        - chapters/08_macroatom.qmd
    - part: "Part III — Derive the effective model yourself"
      chapters:
        - chapters/09_redistribution_matrix.qmd
        - chapters/10_resolution.qmd
        - chapters/11_state_dependence.qmd
        - chapters/12_neural_surrogate.qmd
    - part: "Part IV — Back into radiative transfer"
      chapters:
        - chapters/13_mini_lightcurve.qmd
        - chapters/14_bridge.qmd

execute:
  freeze: false
  echo: false
  warning: false

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    html-math-method: mathjax
    embed-resources: false

jupyter: python3
